<!DOCTYPE html>
<html lang="en" data-theme="noir">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VoiceCart: an accessible, voice-controlled online store for blind and visually impaired shoppers.">
  <meta name="theme-color" content="#0B0B0C">
  <title>VoiceCart — Accessible Voice Shopping</title>
  <link rel="icon" href="data:,">
  <script>
    // Noir is the default. Apply a saved "ivory" choice before the first paint so the page does not flash.
    try {
      if (localStorage.getItem("vc-theme") === "ivory") document.documentElement.setAttribute("data-theme", "ivory");
    } catch (e) { /* storage blocked: keep Noir */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Cormorant Garamond for display type, Inter for the interface. If this request fails, the
       Georgia and Arial fallbacks in src/styles/tokens.css are used (display=swap keeps text visible). -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <noscript>VoiceCart needs JavaScript to run.</noscript>
  <div id="root"></div>
</body>

</html>
